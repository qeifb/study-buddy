<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #1b1c1f;
      color: #e8eaed;
      font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .status { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; color: #9aa0a8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #8a8f98; flex: none; }
    .dot.ok { background: #3fcf7f; }
    .dot.err { background: #ff7b72; }
    .row { display: flex; justify-content: space-between; font-size: 12px; color: #9aa0a8; margin-bottom: 4px; }
    .row b { color: #e8eaed; font-weight: 500; }
    .box {
      margin-top: 10px; padding: 8px 10px; border-radius: 8px;
      background: #26282c; border: 1px solid #33363b; font-size: 12px;
    }
    .box .t { color: #e8eaed; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .box .u { color: #6b7076; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ok { color: #3fcf7f; }
    .no { color: #ffc857; }
    label { display: block; font-size: 11px; color: #9aa0a8; margin-top: 12px; margin-bottom: 4px; }
    input {
      width: 100%; padding: 6px 8px; border-radius: 6px; box-sizing: border-box;
      border: 1px solid #33363b; background: #2a2c31; color: #e8eaed; font: inherit; font-size: 12px;
    }
    button {
      margin-top: 10px; width: 100%; padding: 7px; border-radius: 8px; cursor: pointer;
      border: 1px solid #33363b; background: #2a2c31; color: #e8eaed; font: inherit; font-size: 12px;
    }
    button:hover { background: #33363b; }
    .hint { margin-top: 10px; font-size: 11px; color: #6b7076; line-height: 1.7; }
  </style>
</head>
<body>
  <h1><span>📚</span><span>学习通学伴</span></h1>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">检查应用中…</span>
  </div>

  <div class="row"><span>识别到的学习通页面</span><b id="tab-count">—</b></div>
  <div class="row"><span>扩展版本</span><b id="ver">—</b></div>

  <div id="tabs"></div>

  <label>应用端口</label>
  <input id="port" type="number" placeholder="39517">
  <button id="save">保存并重连</button>

  <div class="hint">
    插件只做「页面内取证」：告诉应用视频在哪。<br>
    视频下载与转写都在你电脑上完成，内容不上传云端。
  </div>

  <script src="popup.js"></script>
</body>
</html>
